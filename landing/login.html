<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>login | lambda</title>
    <meta name="description" content="log in or register to lambda" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link href="styles/output.css" rel="stylesheet" />
    <script src="scripts/main.js" defer></script>
  </head>
  <body>
    <main class="mx-auto max-w-xl px-6 pt-20">
      <div class="mb-6 ml-6">
        <a href="index.html" class="inline-block">
          <img src="assets/logomark.svg" alt="lambda" />
        </a>
      </div>
      <div
        class="flex flex-col items-center gap-3 p-6 border bg-neutral-950 rounded-3xl"
      >
        <div class="flex flex-col gap-1 text-center">
          <h1 class="text-xl">log in or register</h1>
          <p class="text-neutral-400 text-pretty">
            select a provider to continue to the dashboard
          </p>
        </div>
        <div class="flex flex-col gap-3 w-full max-w-md">
          <a href="/auth/google" data-app class="btn btn-border btn-xl">
            <img src="assets/google.svg" alt="google" />
            continue with google
          </a>
          <a href="/auth/github" data-app class="btn btn-border btn-xl">
            <img src="assets/github.svg" alt="github" />
            continue with github
          </a>
        </div>
        <a href="#" class="text-neutral-500 underline">privacy & terms</a>
      </div>
    </main>
  </body>
</html>

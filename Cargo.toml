[package]
name = "lambda"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
dotenvy = "0.15.7"
oauth2 = "5.0.0"
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
redis = { version = "1.7.1", features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "bb8", "uuid"] }
bb8 = "0.9.1"
uuid = { version = "1.28.0", features = ["v4", "v7"] }
tower-http = { version = "0.7.1", features = ["fs"] }
